<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='particle-text.css') }}">
    <script>
        (function() {
            const saved = localStorage.getItem("expense_theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>
<body>
    <!-- FLASH TOAST NOTIFICATIONS -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="toast-container">
          {% for category, message in messages %}
            <div class="toast toast-{{ category }}">
              <span>{{ message }}</span>
              <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-wrapper" style="flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 20px 20px 40px;">
        <!-- INTERACTIVE PARTICLE TEXT HERO (REACT BITS) -->
        <div style="width: 100%; max-width: 700px; height: 130px; position: relative;">
            <div id="particleTextContainer" class="particle-text" style="width: 100%; height: 100%;">
                <canvas class="particle-text__canvas"></canvas>
                <span class="particle-text__sr">Expense Tracker</span>
            </div>
        </div>

        <!-- AUTH CARD -->
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Sign in to manage your expenses and financial goals.</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
                    Sign In
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="{{ url_for('signup') }}">Create Account</a>
            </p>
        </div>
    </div>

    <!-- PARTICLE TEXT & CLICK SPARK (REACT BITS) -->
    <script src="{{ url_for('static', filename='particle-text.js') }}"></script>
    <script src="{{ url_for('static', filename='click-spark.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particleTextContainer');
            if (!container) return;

            const isDark = document.documentElement.classList.contains('dark');

            const instance = createParticleText(container, {
                text: 'Expense Tracker',
                particleSize: 1.8,
                density: 2.2,
                color: isDark ? '#f8fafc' : '#1e293b',
                highlightColor: isDark ? '#2dd4bf' : '#0d9488',
                scatter: 90,
                gatherDuration: 1300,
                stagger: 240,
                pointerRepel: 10,
                repelRadius: 40,
                idleDrift: 0.35,
                trigger: 'hover',
                fontSize: 'clamp(2.5rem, 6.5vw, 4.4rem)',
                fontWeight: 800,
                fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif",
                glow: true
            });

            // Listen for theme changes if theme is switched
            const observer = new MutationObserver(() => {
                const darkNow = document.documentElement.classList.contains('dark');
                if (instance && instance.setTheme) {
                    instance.setTheme(
                        darkNow ? '#f8fafc' : '#1e293b',
                        darkNow ? '#2dd4bf' : '#0d9488'
                    );
                }
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        });
    </script>
</body>
</html>
