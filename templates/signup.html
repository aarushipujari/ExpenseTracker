<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            const saved = localStorage.getItem("expense_theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>
<body>
    <!-- FLASH TOAST NOTIFICATIONS -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="toast-container">
          {% for category, message in messages %}
            <div class="toast toast-{{ category }}">
              <span>{{ message }}</span>
              <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">₹</div>
            <h1>Create Account</h1>
            <p>Start tracking your expenses and investments today.</p>

            <form method="POST" action="{{ url_for('signup') }}">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" value="{{ name or '' }}" placeholder="Your Name" required autofocus>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password (min 8 characters)</label>
                    <input type="password" name="password" minlength="8" placeholder="Create a secure password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
                    Create Account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </p>
        </div>
    </div>

    <!-- CLICK SPARK (REACT BITS) -->
    <script src="{{ url_for('static', filename='click-spark.js') }}"></script>
</body>
</html>
