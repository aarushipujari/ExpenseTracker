<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Set New Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            const saved = localStorage.getItem("expense_theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>
<body>
    <!-- FLASH TOAST NOTIFICATIONS -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="toast-container">
          {% for category, message in messages %}
            <div class="toast toast-{{ category }}">
              <span>{{ message }}</span>
              <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Set New Password</h1>
            <p>Enter a new password for <strong>{{ email }}</strong>.</p>

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <div class="form-group">
                    <label>New Password (min 8 characters)</label>
                    <input type="password" name="password" minlength="8" placeholder="Enter new password" required autofocus>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" minlength="8" placeholder="Re-enter new password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 12px;">
                    Update Password & Sign In
                </button>
            </form>

            <p class="auth-switch" style="margin-top: 24px;">
                Remembered your password? <a href="{{ url_for('login') }}">Back to Sign In</a>
            </p>
        </div>
    </div>

    <!-- CLICK SPARK -->
    <script src="{{ url_for('static', filename='click-spark.js') }}"></script>
</body>
</html>
